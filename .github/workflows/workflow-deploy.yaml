name: Build and Push

on:
  push:
    # branches:
    #   - main

env:
  IMAGE_NAME: gsx2json
  FULL_IMAGE: registry.maxroll.gg/internal/gsx2json
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: echo image targets
        run: |
          echo "Image name: ${{ env.FULL_IMAGE }}"
          echo "GHCR image: ${{ env.GHCR_IMAGE }}"
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Resolve GHCR target
        id: ghcr
        # main/master -> prod, staging -> stag, dev -> dev, other branches skip GHCR
        run: |
          case "$GITHUB_REF_NAME" in
            main|master) prefix=prod; push=true ;;
            staging)     prefix=stag; push=true ;;
            dev)         prefix=dev;  push=true ;;
            *)           prefix=;     push=false ;;
          esac
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "push=${push}" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.FULL_IMAGE }}
          tags: |
            type=raw,value=latest,enable: ${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=sha
      - name: Docker meta (GHCR)
        id: meta-ghcr
        if: steps.ghcr.outputs.push == 'true'
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=sha,prefix=${{ steps.ghcr.outputs.prefix }}-sha-
      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: registry.maxroll.gg
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Login to GitHub Container Registry
        if: steps.ghcr.outputs.push == 'true'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v2
      - uses: docker/build-push-action@v4
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
