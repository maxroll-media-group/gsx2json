name: Build and Push

on:
  push:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Resolve GHCR target
        id: ghcr
        # main/master -> prod, staging -> stag, dev -> dev, other branches build only
        run: |
          case "$GITHUB_REF_NAME" in
            main|master) prefix=prod; push=true ;;
            staging)     prefix=stag; push=true ;;
            dev)         prefix=dev;  push=true ;;
            *)           prefix=;     push=false ;;
          esac
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "push=${push}" >> "$GITHUB_OUTPUT"
      - name: Echo target
        run: |
          echo "GHCR image: ${{ env.GHCR_IMAGE }}"
          echo "Push: ${{ steps.ghcr.outputs.push }} (prefix: ${{ steps.ghcr.outputs.prefix }})"
      - name: Docker meta
        id: meta
        if: steps.ghcr.outputs.push == 'true'
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=sha,prefix=${{ steps.ghcr.outputs.prefix }}-sha-
      - name: Login to GitHub Container Registry
        if: steps.ghcr.outputs.push == 'true'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v2
      - uses: docker/build-push-action@v4
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: ${{ steps.ghcr.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}